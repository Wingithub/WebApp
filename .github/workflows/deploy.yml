name: CI/CD Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/webapp:${{ github.sha }}

      - name: Deploy container on server
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest
          docker stop webapp || true
          docker rm webapp || true
          docker run -d --name webapp -p 8080:3000 \
            --restart unless-stopped \
            ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest
          docker image prune -f

      - name: Verify deployment
        run: |
          sleep 5
          docker ps --filter "name=webapp"
          curl -f http://localhost:8080 || (echo "Web không phản hồi" && exit 1)
